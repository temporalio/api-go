version: 0.14.0

profiles:
  testx: off

go-modules:
  build: off
  cmd/proxygenerator: off

format:
  go:
    formatter: gofumpt
    gci: on

lint:
  actionlint: on
  go:
    gofix: on
    golangci-lint:
      analyzers:
        errortype:
          version: v0.0.7
        nilaway: off
        workflowcheck: off
    gomodtidy: on
